[package]
name = "pq-transport-gateway"
version = "2.0.0"
edition = "2021"
authors = ["Paraxiom Technologies Inc. <security@paraxiom.org>"]
description = "Post-Quantum secure proxy for QKD infrastructure (ETSI 014). Wire-incompatible with the broken 1.0.0; do not use 1.0.0."
license = "GPL-3.0-only"
keywords = ["quantum", "cryptography", "post-quantum", "qkd", "proxy"]
categories = ["cryptography", "network-programming"]
repository = "https://github.com/Paraxiom/pq-transport-gateway"

[workspace]
# Standalone workspace to avoid parent conflicts

[lib]
name = "pq_qkd_proxy"
path = "src/lib.rs"

[dependencies]
# Post-quantum cryptography — Paraxiom unified API (pure-Rust PQC primitives)
# Provides ML-KEM (FIPS 203), ML-DSA (FIPS 204), SLH-DSA (FIPS 205), Falcon
paraxiom-pqc = { git = "https://github.com/Paraxiom/paraxiom-pqc.git" }

# Transitive versions are resolved from the vendored ml-dsa/slh-dsa forks.

# Symmetric cryptography (NIST approved)
aes-gcm = "0.10"
sha3 = "0.10"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Networking  
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# Utilities
rand = "0.8"
base64 = "0.21"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Security
zeroize = { version = "1.7", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time handling  
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
httpmock = "0.7"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "handshake"
harness = false

[[bench]]
name = "audit"
harness = false

[[bin]]
name = "pq-qkd-proxy"
path = "src/main.rs"
