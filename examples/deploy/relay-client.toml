[proxy]
listen = "127.0.0.1:18443"
max_connections = 100
connection_timeout = 30
allowed_sources = []

[qkd]
vendor_api = "https://localhost:443"
api_version = "1.0"
key_timeout = 5
max_key_size = 1048576

[security]
pq_algorithm = "falcon512"
sig_algorithm = "sphincsplus"
authorized_keys = "/etc/pq-qkd-proxy/authorized_keys"
proxy_private_key = "/etc/pq-qkd-proxy/proxy.key"
proxy_certificate = "/etc/pq-qkd-proxy/proxy.pub"

[relay]
standalone = true
enabled = true
mode = "client"
listen = "127.0.0.1:9444"
remote = "127.0.0.1:9443"
# The relay server's identity fingerprint, as printed by `pq-qkd-proxy
# --print-fingerprint` on the server (or `relay_wan server` at startup).
# Required: without it the client cannot tell the real server from an on-path
# impostor. `allow_unpinned = true` is the explicit, WARN-logged opt-out, for a
# bench on a link you already trust only. Replace this example value.
pin = "SHA3-256:lFq1ySM01cDbjUfofVTcYvDzoAUiAf2gvg09noZBahc"
