[package]
name = "pq-transport-gateway-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
# Session and handshake targets: the gateway's own wire codec and runtime,
# already in its dependency tree.
base64 = "0.21"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["rt", "net", "io-util", "time"] }

[dependencies.pq-transport-gateway]
path = ".."

# Prevent this from being picked up by the parent workspace.
[workspace]

# Each [[bin]] is one fuzz target. To run a target:
#   cargo +nightly fuzz run <name>
# To run with a time budget:
#   cargo +nightly fuzz run <name> -- -max_total_time=3600

[[bin]]
name = "etsi014_status"
path = "fuzz_targets/etsi014_status.rs"
test = false
doc = false
bench = false

[[bin]]
name = "etsi014_key_container"
path = "fuzz_targets/etsi014_key_container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "etsi014_error"
path = "fuzz_targets/etsi014_error.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mix_keys"
path = "fuzz_targets/mix_keys.rs"
test = false
doc = false
bench = false

# Gateway session layer (wire 2.1 / 3.2) and the handshake messages the
# gateway parses. See each file's header for the properties asserted.

[[bin]]
name = "session_frame"
path = "fuzz_targets/session_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_payload"
path = "fuzz_targets/session_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gateway_messages"
path = "fuzz_targets/gateway_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_hello_path"
path = "fuzz_targets/server_hello_path.rs"
test = false
doc = false
bench = false
