[package]
name = "pq-transport-gateway-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[dependencies.pq-transport-gateway]
path = ".."

# Prevent this from being picked up by the parent workspace.
[workspace]

# Each [[bin]] is one fuzz target. To run a target:
#   cargo +nightly fuzz run <name>
# To run with a time budget:
#   cargo +nightly fuzz run <name> -- -max_total_time=3600

[[bin]]
name = "etsi014_status"
path = "fuzz_targets/etsi014_status.rs"
test = false
doc = false
bench = false

[[bin]]
name = "etsi014_key_container"
path = "fuzz_targets/etsi014_key_container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "etsi014_error"
path = "fuzz_targets/etsi014_error.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mix_keys"
path = "fuzz_targets/mix_keys.rs"
test = false
doc = false
bench = false
